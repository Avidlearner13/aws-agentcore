apiVersion: agentcore/v1
kind: AgentRuntime

metadata:
  name: coverage
  displayName: Coverage & Adjudication
  description: >-
    Matches a structured claim_record against the policy text: coverage status,
    applicable coverages, exclusions, deductible and eligible payout.
  labels:
    phase: "1"
    role: coverage

spec:
  source:
    framework: claude-agent-sdk
    language: python
    entrypoint: main.py
    build:
      type: container
      context: agents/coverage
      dockerfile: Dockerfile
      requirements: requirements.txt
      platform: linux/arm64
      remote_build: true

  model:
    id: us.anthropic.claude-sonnet-4-6
    overrideEnvVar: CLAUDE_MODEL
    # The Claude Agent SDK runs the bundled Claude Code CLI as a subprocess and
    # routes it at Bedrock. Both flags below are set in the image, and the
    # execution role needs bedrock:ListInferenceProfiles for model discovery -
    # without it the CLI silently falls back to a hardcoded model list.
    provider:
      type: bedrock
      requiresInferenceProfileDiscovery: true

  runtime:
    protocol: HTTP
    networkMode: PUBLIC
    observability:
      enabled: true
    lifecycle:
      idleSessionTimeoutSeconds: null
      maxLifetimeSeconds: null

  memory:
    enabled: true
    name: coverage_mem
    mode: STM_ONLY
    eventExpiryDays: 30

  identity:
    inbound:
      type: IAM
      jwt:
        enabled: false
        audiences: []
        issuerUrl: null
        signingAlgorithm: ES384
        durationSeconds: 300
    outbound:
      credentialProviders: []

  tools:
    mcpServers: []
    gateways: []

  dependencies: []

  data: []

  # IAM controls across the full lifecycle, in the order they are evaluated.
  # Each entry is one authorization decision: who is being checked, for what
  # action, on what resource, and whether it leaves an audit record.
  # This is the map to configure IAM from - anything granted but not listed
  # here is over-permission.
  controls:

    # ---- OPERATOR: one-time infrastructure. The developer never needs these. ----
    provision:
      - step: 1-create-execution-role
        principal: operator
        actions: [iam:CreateRole, iam:PutRolePolicy, iam:AttachRolePolicy]
        resource: role/AmazonBedrockAgentCoreSDKRuntime-*
        produces: the role the agent executes as
        audit: cloudtrail
        note: >-
          Defining what the agent may do stays with the operator. The developer
          only passes this role, never edits it.
      - step: 2-create-memory
        principal: operator
        actions: [bedrock-agentcore:CreateMemory, bedrock-agentcore:GetMemory]
        resource: memory/coverage_mem
        produces: memoryId
        audit: cloudtrail
      - step: 3-create-ecr-and-build-project
        principal: operator
        actions: [ecr:CreateRepository, codebuild:CreateProject]
        resource: [repository/bedrock-agentcore-coverage, project/bedrock-agentcore-coverage-builder]
        produces: image repository and build project
        audit: cloudtrail
      - step: 4-create-runtime
        principal: operator
        actions: [bedrock-agentcore:CreateAgentRuntime]
        resource: runtime/coverage
        produces: agentRuntimeArn, version 1
        audit: cloudtrail
        alsoRequires:
          - action: iam:PassRole
            resource: role/AmazonBedrockAgentCoreSDKRuntime-*
            why: >-
              The runtime executes AS this role. Wildcard PassRole is an operator
              grant; the developer gets it scoped to one role ARN.
      - step: 5-grant-developer-access
        principal: operator
        actions: [iam:PutRolePolicy]
        resource: role/developer
        produces: the developer policy - steps 6 to 9
        audit: cloudtrail
        note: The handover point. After this the developer iterates unaided.

    # ---- DEVELOPER: the daily loop. No new infrastructure. ----
    release:
      - step: 6-package-and-build
        principal: developer
        actions: [s3:PutObject, codebuild:StartBuild, codebuild:BatchGetBuilds]
        resource: [s3://bedrock-agentcore-codebuild-sources-*/coverage/,
                   project/bedrock-agentcore-coverage-builder]
        produces: a new image digest in ECR
        audit: cloudtrail
      - step: 7-deploy-new-version
        principal: developer
        actions: [bedrock-agentcore:UpdateAgentRuntime, bedrock-agentcore:GetAgentRuntime]
        resource: runtime/coverage
        produces: a new immutable runtime version
        audit: cloudtrail
        alsoRequires:
          - action: iam:PassRole
            resource: role/AmazonBedrockAgentCoreSDKRuntime-*
            why: >-
              UpdateAgentRuntime re-passes the execution role, so the developer
              needs PassRole - scoped to this role ARN only. Deploy new code,
              never change what the code may do.
        failsAs: AccessDenied on PassRole if only UpdateAgentRuntime was granted.
      - step: 8-pin-endpoint
        principal: developer
        actions: [bedrock-agentcore:UpdateAgentRuntimeEndpoint,
                  bedrock-agentcore:GetAgentRuntimeEndpoint]
        resource: runtime-endpoint/coverage/DEFAULT
        produces: endpoint targetVersion moved to the new version
        audit: cloudtrail
        failsAs: Left unset the endpoint floats and keeps serving an older version.
      - step: 9-read-logs
        principal: developer
        actions: [logs:FilterLogEvents, logs:GetLogEvents, logs:DescribeLogStreams]
        resource: log-group:/aws/bedrock-agentcore/runtimes/coverage-*
        produces: runtime logs for debugging
        audit: none

    # ---- RUNTIME: no human principal. ----
    invoke:
      - step: 10-authorize-caller
        principal: [console-instance, orchestrator]
        actions: [bedrock-agentcore:InvokeAgentRuntime]
        resource: runtime/coverage
        produces: runtimeSessionId
        audit: none
        note: Data-plane call - not in CloudTrail management events.
      - step: 11-assume-execution-role
        principal: bedrock-agentcore.amazonaws.com
        actions: [sts:AssumeRole]
        resource: role/AmazonBedrockAgentCoreSDKRuntime-*
        produces: temporary credentials in the container
        audit: cloudtrail
      - step: 12-memory-read
        principal: agent-runtime-execution
        actions: [bedrock-agentcore:ListEvents]
        resource: memory/coverage_mem
        produces: prior session events
        audit: none
      - step: 13-model-invoke
        principal: agent-runtime-execution
        actions: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
        resource: inference-profile/us.anthropic.claude-sonnet-4-6
        produces: the model output for this agent's task
        audit: cloudtrail
        failsAs: >-
          ResourceNotFoundException when model access is not granted - surfaces at
          invoke time, never at provision time.
      - step: 14-model-discovery
        principal: agent-runtime-execution
        actions: [bedrock:ListInferenceProfiles, bedrock:GetInferenceProfile]
        resource: inference-profile/*
        produces: list of invokable models
        audit: cloudtrail
        failsAs: >-
          AccessDenied, after which the bundled CLI silently falls back to a
          hardcoded model list and reports a model unrelated to the configured one.
      - step: 16-memory-write
        principal: agent-runtime-execution
        actions: [bedrock-agentcore:CreateEvent]
        resource: memory/coverage_mem
        produces: session event records
        audit: none
      - step: 17-telemetry
        principal: agent-runtime-execution
        actions: [logs:CreateLogStream, logs:PutLogEvents, xray:PutTraceSegments]
        resource: log-group:/aws/bedrock-agentcore/runtimes/coverage-*
        produces: log stream + trace
        audit: none

    # ---- OPERATOR: teardown is not a developer action. ----
    teardown:
      - step: 18-delete
        principal: operator
        actions: [bedrock-agentcore:DeleteAgentRuntime, bedrock-agentcore:DeleteMemory,
                  ecr:DeleteRepository, iam:DeleteRole]
        resource: [runtime/coverage, memory/coverage_mem, repository/bedrock-agentcore-coverage]
        produces: nothing (resources removed)
        audit: cloudtrail

  console:
    key: coverage
    group: specialist
    label: Coverage & Adjudication
    arnEnv: COVERAGE_ARN
    urlEnv: COVERAGE_URL
    localPort: 8771

  env: {}
