apiVersion: agentcore/v1
kind: AgentRuntime

metadata:
  name: coverage
  displayName: Coverage & Adjudication
  description: >-
    Matches a structured claim_record against the policy text: coverage status,
    applicable coverages, exclusions, deductible and eligible payout.
  labels:
    phase: "1"
    role: coverage

spec:
  source:
    framework: claude-agent-sdk
    language: python
    entrypoint: main.py
    build:
      type: container
      context: agents/coverage
      dockerfile: Dockerfile
      requirements: requirements.txt
      platform: linux/arm64
      remote_build: true

  model:
    id: us.anthropic.claude-sonnet-4-6
    overrideEnvVar: CLAUDE_MODEL
    # The Claude Agent SDK runs the bundled Claude Code CLI as a subprocess and
    # routes it at Bedrock. Both flags below are set in the image, and the
    # execution role needs bedrock:ListInferenceProfiles for model discovery -
    # without it the CLI silently falls back to a hardcoded model list.
    provider:
      type: bedrock
      requiresInferenceProfileDiscovery: true

  runtime:
    protocol: HTTP
    networkMode: PUBLIC
    observability:
      enabled: true
    lifecycle:
      idleSessionTimeoutSeconds: null
      maxLifetimeSeconds: null

  memory:
    enabled: true
    name: coverage_mem
    mode: STM_ONLY
    eventExpiryDays: 30

  identity:
    inbound:
      type: IAM
      jwt:
        enabled: false
        audiences: []
        issuerUrl: null
        signingAlgorithm: ES384
        durationSeconds: 300
    outbound:
      credentialProviders: []

  tools:
    mcpServers: []
    gateways: []

  dependencies: []

  data: []

  console:
    key: coverage
    group: specialist
    label: Coverage & Adjudication
    arnEnv: COVERAGE_ARN
    urlEnv: COVERAGE_URL
    localPort: 8771

  env: {}
