apiVersion: agentcore/v1
kind: AgentRuntime

metadata:
  name: intake
  displayName: Intake & Document Intelligence
  description: >-
    Parses a raw FNOL narrative plus policy text into a structured claim_record
    (claimant, loss, peril category, line items, totals).
  labels:
    phase: "1"
    role: intake

spec:
  source:
    framework: gcp-adk            # informational: which agent framework the code uses
    language: python
    entrypoint: main.py            # relative to build.context - never an absolute path
    build:
      type: container             # container | direct_code_deploy
      context: agents/intake     # repo-relative
      dockerfile: Dockerfile
      requirements: requirements.txt
      platform: linux/arm64       # AgentCore runtime requires arm64
      remote_build: true          # build off-host (no local Docker required)

  model:
    id: us.amazon.nova-pro-v1:0
    overrideEnvVar: CLAUDE_MODEL  # env var the code reads to override the default

  runtime:
    protocol: HTTP                # HTTP | MCP | A2A | AGUI
    networkMode: PUBLIC           # PUBLIC | VPC
    observability:
      enabled: true               # OTEL -> CloudWatch, provisioned by the platform
    lifecycle:
      idleSessionTimeoutSeconds: null   # null = service default (900)
      maxLifetimeSeconds: null          # null = service default (28800)

  memory:
    enabled: true
    name: intake_mem
    mode: STM_ONLY                # STM_ONLY | STM_AND_LTM
    eventExpiryDays: 30

  identity:
    inbound:
      type: IAM                   # IAM | JWT | OAUTH - who may invoke this runtime
      jwt:
        enabled: false
        audiences: []
        issuerUrl: null
        signingAlgorithm: ES384
        durationSeconds: 300
    outbound:
      credentialProviders: []     # named providers this agent may use for egress auth

  tools:
    mcpServers: []                # outbound MCP servers this agent may call
    gateways: []                  # AgentCore Gateway targets exposing tools over MCP

  dependencies: []                # other agents this one invokes

  data: []                        # datasets/KBs mounted into the image

  # How the control plane surfaces this agent. Read at startup so the console's
  # registry is derived from here rather than hardcoded.
  # IAM controls across the full lifecycle, in the order they are evaluated.
  # Each entry is one authorization decision: who is being checked, for what
  # action, on what resource, and whether it leaves an audit record.
  # This is the map to configure IAM from - anything granted but not listed
  # here is over-permission.
  controls:

    # --- build the image -----------------------------------------------------
    build:
      - step: 1-upload-source
        principal: operator
        actions: [s3:PutObject]
        resource: s3://bedrock-agentcore-codebuild-sources-*/intake/
        audit: none
      - step: 2-start-build
        principal: operator
        actions: [codebuild:StartBuild, codebuild:BatchGetBuilds]
        resource: project/bedrock-agentcore-intake-builder
        audit: cloudtrail
      - step: 3-push-image
        principal: agent-build-execution
        actions: [ecr:GetAuthorizationToken, ecr:InitiateLayerUpload,
                  ecr:UploadLayerPart, ecr:CompleteLayerUpload, ecr:PutImage,
                  s3:GetObject, logs:PutLogEvents]
        resource: repository/bedrock-agentcore-intake
        audit: cloudtrail

    # --- provision the runtime ----------------------------------------------
    provision:
      - step: 4-create-execution-role
        principal: operator
        actions: [iam:CreateRole, iam:PutRolePolicy, iam:AttachRolePolicy, iam:GetRole]
        resource: role/AmazonBedrockAgentCoreSDKRuntime-*
        audit: cloudtrail
      - step: 5-create-memory
        principal: operator
        actions: [bedrock-agentcore:CreateMemory, bedrock-agentcore:GetMemory]
        resource: memory/intake_mem
        audit: cloudtrail
      - step: 6-create-or-update-runtime
        principal: operator
        actions: [bedrock-agentcore:CreateAgentRuntime,
                  bedrock-agentcore:UpdateAgentRuntime,
                  bedrock-agentcore:GetAgentRuntime,
                  bedrock-agentcore:ListAgentRuntimes]
        resource: runtime/intake
        audit: cloudtrail
        alsoRequires:
          - action: iam:PassRole
            resource: role/AmazonBedrockAgentCoreSDKRuntime-*
            why: >-
              The runtime runs AS the execution role. PassRole is the control
              deciding who may hand that role to the service - the single most
              privilege-sensitive grant in provisioning.
      - step: 7-pin-endpoint
        principal: operator
        actions: [bedrock-agentcore:UpdateAgentRuntimeEndpoint,
                  bedrock-agentcore:GetAgentRuntimeEndpoint,
                  bedrock-agentcore:ListAgentRuntimeEndpoints]
        resource: runtime-endpoint/risk/DEFAULT
        audit: cloudtrail
        note: Sets targetVersion. Unpinned, the endpoint floats onto new versions.

    # --- serve a request -----------------------------------------------------
    invoke:
      - step: 8-authorize-caller
        principal: [console-instance, orchestrator]
        actions: [bedrock-agentcore:InvokeAgentRuntime]
        resource: runtime/intake
        audit: none
        note: >-
          Data-plane call. NOT recorded in CloudTrail management events, so this
          hop has no audit trail by default - the reason it must be declared.
      - step: 9-assume-execution-role
        principal: bedrock-agentcore.amazonaws.com
        actions: [sts:AssumeRole]
        resource: role/AmazonBedrockAgentCoreSDKRuntime-*
        audit: cloudtrail
        note: Trust policy, not an identity policy - the other half of PassRole.
      - step: 11-session-memory
        principal: agent-runtime-execution
        actions: [bedrock-agentcore:CreateEvent, bedrock-agentcore:ListEvents,
                  bedrock-agentcore:RetrieveMemoryRecords]
        resource: memory/intake_mem
        audit: none
      - step: 12-model-invoke
        principal: agent-runtime-execution
        actions: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
        resource: inference-profile/us.amazon.nova-pro-v1:0
        audit: cloudtrail
        failsAs: >-
          ResourceNotFoundException when model access is not granted for the
          account, which surfaces at invoke time - never at provision time.
      - step: 13-telemetry
        principal: agent-runtime-execution
        actions: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents,
                  xray:PutTraceSegments]
        resource: log-group:/aws/bedrock-agentcore/runtimes/intake-*
        audit: none

    # --- teardown ------------------------------------------------------------
    teardown:
      - step: 14-delete
        principal: operator
        actions: [bedrock-agentcore:DeleteAgentRuntime,
                  bedrock-agentcore:DeleteMemory,
                  ecr:DeleteRepository, iam:DeleteRole]
        resource: [runtime/intake, memory/intake_mem, repository/bedrock-agentcore-intake]
        audit: cloudtrail

  console:
    key: intake
    group: specialist             # specialist | orchestrator
    label: Intake & Document Intelligence
    arnEnv: INTAKE_ARN
    urlEnv: INTAKE_URL
    localPort: 8772               # local dev only

  env: {}                         # extra plain env vars (no secrets - see platform.secrets)
