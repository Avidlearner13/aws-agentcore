apiVersion: agentcore/v1
kind: AgentRuntime

metadata:
  name: orchestrator
  displayName: Claude SDK Supervisor
  description: >-
    Phase-2 supervisor. Calls Intake, then Coverage and Risk, cross-runtime via
    InvokeAgentRuntime, then synthesises the final adjudication decision.
  labels:
    phase: "2"
    role: supervisor

spec:
  source:
    framework: claude-agent-sdk
    language: python
    entrypoint: main.py
    build:
      type: container
      context: agents/orchestrator
      dockerfile: Dockerfile
      requirements: requirements.txt
      platform: linux/arm64
      remote_build: true

  model:
    id: us.anthropic.claude-sonnet-4-6
    overrideEnvVar: CLAUDE_MODEL
    provider:
      type: bedrock
      requiresInferenceProfileDiscovery: true

  runtime:
    protocol: HTTP
    networkMode: PUBLIC
    observability:
      enabled: true
    lifecycle:
      # The full pipeline is a long call (~60s observed). Raise if specialists grow.
      idleSessionTimeoutSeconds: null
      maxLifetimeSeconds: null

  memory:
    enabled: true
    name: orchestrator_mem
    mode: STM_ONLY
    eventExpiryDays: 30

  identity:
    inbound:
      type: IAM
      jwt:
        enabled: false
        audiences: []
        issuerUrl: null
        signingAlgorithm: ES384
        durationSeconds: 300
    outbound:
      credentialProviders: []

  tools:
    mcpServers: []
    gateways: []

  # The provisioner resolves each dependency to the target runtime's ARN, injects
  # it under injectAs, AND grants bedrock-agentcore:InvokeAgentRuntime on that ARN
  # (plus /*) to this agent's execution role. Declaring the edge here is what keeps
  # ARNs out of the manifest entirely.
  dependencies:
    - agent: intake
      injectAs: INTAKE_ARN
      grant: invoke
    - agent: coverage
      injectAs: COVERAGE_ARN
      grant: invoke
    - agent: risk
      injectAs: RISK_ARN
      grant: invoke

  data: []

  # IAM controls across the full lifecycle, in the order they are evaluated.
  # Each entry is one authorization decision: who is being checked, for what
  # action, on what resource, and whether it leaves an audit record.
  # This is the map to configure IAM from - anything granted but not listed
  # here is over-permission.
  controls:

    # --- build the image -----------------------------------------------------
    build:
      - step: 1-upload-source
        principal: operator
        actions: [s3:PutObject]
        resource: s3://bedrock-agentcore-codebuild-sources-*/orchestrator/
        audit: none
      - step: 2-start-build
        principal: operator
        actions: [codebuild:StartBuild, codebuild:BatchGetBuilds]
        resource: project/bedrock-agentcore-orchestrator-builder
        audit: cloudtrail
      - step: 3-push-image
        principal: agent-build-execution
        actions: [ecr:GetAuthorizationToken, ecr:InitiateLayerUpload,
                  ecr:UploadLayerPart, ecr:CompleteLayerUpload, ecr:PutImage,
                  s3:GetObject, logs:PutLogEvents]
        resource: repository/bedrock-agentcore-orchestrator
        audit: cloudtrail

    # --- provision the runtime ----------------------------------------------
    provision:
      - step: 4-create-execution-role
        principal: operator
        actions: [iam:CreateRole, iam:PutRolePolicy, iam:AttachRolePolicy, iam:GetRole]
        resource: role/AmazonBedrockAgentCoreSDKRuntime-*
        audit: cloudtrail
      - step: 5-create-memory
        principal: operator
        actions: [bedrock-agentcore:CreateMemory, bedrock-agentcore:GetMemory]
        resource: memory/orchestrator_mem
        audit: cloudtrail
      - step: 6-create-or-update-runtime
        principal: operator
        actions: [bedrock-agentcore:CreateAgentRuntime,
                  bedrock-agentcore:UpdateAgentRuntime,
                  bedrock-agentcore:GetAgentRuntime,
                  bedrock-agentcore:ListAgentRuntimes]
        resource: runtime/orchestrator
        audit: cloudtrail
        alsoRequires:
          - action: iam:PassRole
            resource: role/AmazonBedrockAgentCoreSDKRuntime-*
            why: >-
              The runtime runs AS the execution role. PassRole is the control
              deciding who may hand that role to the service - the single most
              privilege-sensitive grant in provisioning.
      - step: 7-pin-endpoint
        principal: operator
        actions: [bedrock-agentcore:UpdateAgentRuntimeEndpoint,
                  bedrock-agentcore:GetAgentRuntimeEndpoint,
                  bedrock-agentcore:ListAgentRuntimeEndpoints]
        resource: runtime-endpoint/orchestrator/DEFAULT
        audit: cloudtrail
        note: Sets targetVersion. Unpinned, the endpoint floats onto new versions.

    # --- serve a request -----------------------------------------------------
    invoke:
      - step: 8-authorize-caller
        principal: [console-instance, orchestrator]
        actions: [bedrock-agentcore:InvokeAgentRuntime]
        resource: runtime/orchestrator
        audit: none
        note: >-
          Data-plane call. NOT recorded in CloudTrail management events, so this
          hop has no audit trail by default - the reason it must be declared.
      - step: 9-invoke-downstream-agents
        principal: agent-runtime-execution
        actions: [bedrock-agentcore:InvokeAgentRuntime]
        resource: [runtime/intake, runtime/coverage, runtime/risk]
        audit: none
        derivedFrom: spec.dependencies
        note: >-
          Granted by the InvokeSpecialistRuntimes inline policy. Each dependency
          edge in spec.dependencies produces one statement here.
      - step: 9-assume-execution-role
        principal: bedrock-agentcore.amazonaws.com
        actions: [sts:AssumeRole]
        resource: role/AmazonBedrockAgentCoreSDKRuntime-*
        audit: cloudtrail
        note: Trust policy, not an identity policy - the other half of PassRole.
      - step: 10-model-discovery
        principal: agent-runtime-execution
        actions: [bedrock:ListInferenceProfiles, bedrock:GetInferenceProfile]
        resource: inference-profile/*
        audit: cloudtrail
        failsAs: >-
          AccessDenied, after which the bundled CLI silently falls back to a
          hardcoded model list and reports a model unrelated to the configured one.
      - step: 11-session-memory
        principal: agent-runtime-execution
        actions: [bedrock-agentcore:CreateEvent, bedrock-agentcore:ListEvents,
                  bedrock-agentcore:RetrieveMemoryRecords]
        resource: memory/orchestrator_mem
        audit: none
      - step: 12-model-invoke
        principal: agent-runtime-execution
        actions: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
        resource: inference-profile/us.anthropic.claude-sonnet-4-6
        audit: cloudtrail
        failsAs: >-
          ResourceNotFoundException when model access is not granted for the
          account, which surfaces at invoke time - never at provision time.
      - step: 13-telemetry
        principal: agent-runtime-execution
        actions: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents,
                  xray:PutTraceSegments]
        resource: log-group:/aws/bedrock-agentcore/runtimes/orchestrator-*
        audit: none

    # --- teardown ------------------------------------------------------------
    teardown:
      - step: 14-delete
        principal: operator
        actions: [bedrock-agentcore:DeleteAgentRuntime,
                  bedrock-agentcore:DeleteMemory,
                  ecr:DeleteRepository, iam:DeleteRole]
        resource: [runtime/orchestrator, memory/orchestrator_mem, repository/bedrock-agentcore-orchestrator]
        audit: cloudtrail

  console:
    key: claude                   # selector value in the orchestrator dropdown
    group: orchestrator
    label: Claude SDK supervisor
    arnEnv: ORCH_CLAUDE_ARN
    urlEnv: ORCH_CLAUDE_URL
    localPort: 8774

  env: {}
