apiVersion: agentcore/v1
kind: AgentRuntime

metadata:
  name: risk
  displayName: Risk, Fraud & Compliance
  description: >-
    RAG over a bundled guideline knowledge base. Produces a fraud score, risk
    level and compliance flags, each citing the guideline IDs it relied on.
  labels:
    phase: "1"
    role: risk

spec:
  source:
    framework: langchain
    language: python
    entrypoint: main.py
    build:
      type: container
      context: agents/risk
      dockerfile: Dockerfile
      requirements: requirements.txt
      platform: linux/arm64
      remote_build: true

  model:
    id: us.amazon.nova-pro-v1:0
    overrideEnvVar: CLAUDE_MODEL

  runtime:
    protocol: HTTP
    networkMode: PUBLIC
    observability:
      enabled: true
    lifecycle:
      idleSessionTimeoutSeconds: null
      maxLifetimeSeconds: null

  memory:
    enabled: true
    name: risk_mem
    mode: STM_ONLY
    eventExpiryDays: 30

  identity:
    inbound:
      type: IAM
      jwt:
        enabled: false
        audiences: []
        issuerUrl: null
        signingAlgorithm: ES384
        durationSeconds: 300
    outbound:
      credentialProviders: []

  tools:
    mcpServers: []
    gateways: []

  dependencies: []

  data:
    # Baked into the image at build time; KB_DIR is resolved relative to the
    # module so the path holds inside the container.
    - name: guidelines-kb
      type: bundled
      source: agents/risk/kb
      mountPath: /app/kb

  # IAM controls across the full lifecycle, in the order they are evaluated.
  # Each entry is one authorization decision: who is being checked, for what
  # action, on what resource, and whether it leaves an audit record.
  # This is the map to configure IAM from - anything granted but not listed
  # here is over-permission.
  controls:

    # --- build the image -----------------------------------------------------
    build:
      - step: 1-upload-source
        produces: source.zip in the CodeBuild source bucket
        principal: operator
        actions: [s3:PutObject]
        resource: s3://bedrock-agentcore-codebuild-sources-*/risk/
        audit: none
      - step: 2-start-build
        produces: buildId (CodeBuild)
        principal: operator
        actions: [codebuild:StartBuild, codebuild:BatchGetBuilds]
        resource: project/bedrock-agentcore-risk-builder
        audit: cloudtrail
      - step: 3-push-image
        produces: image sha256 digest in ECR
        principal: agent-build-execution
        actions: [ecr:GetAuthorizationToken, ecr:InitiateLayerUpload,
                  ecr:UploadLayerPart, ecr:CompleteLayerUpload, ecr:PutImage,
                  s3:GetObject, logs:PutLogEvents]
        resource: repository/bedrock-agentcore-risk
        audit: cloudtrail

    # --- provision the runtime ----------------------------------------------
    provision:
      - step: 4-create-execution-role
        produces: execution role ARN
        principal: operator
        actions: [iam:CreateRole, iam:PutRolePolicy, iam:AttachRolePolicy, iam:GetRole]
        resource: role/AmazonBedrockAgentCoreSDKRuntime-*
        audit: cloudtrail
      - step: 5-create-memory
        produces: memoryId + memoryArn
        principal: operator
        actions: [bedrock-agentcore:CreateMemory, bedrock-agentcore:GetMemory]
        resource: memory/risk_mem
        audit: cloudtrail
      - step: 6-create-or-update-runtime
        produces: agentRuntimeArn, agentRuntimeId, agentRuntimeVersion
        principal: operator
        actions: [bedrock-agentcore:CreateAgentRuntime,
                  bedrock-agentcore:UpdateAgentRuntime,
                  bedrock-agentcore:GetAgentRuntime,
                  bedrock-agentcore:ListAgentRuntimes]
        resource: runtime/risk
        audit: cloudtrail
        alsoRequires:
          - action: iam:PassRole
            resource: role/AmazonBedrockAgentCoreSDKRuntime-*
            why: >-
              The runtime runs AS the execution role. PassRole is the control
              deciding who may hand that role to the service - the single most
              privilege-sensitive grant in provisioning.
      - step: 7-pin-endpoint
        produces: endpoint targetVersion (pinned)
        principal: operator
        actions: [bedrock-agentcore:UpdateAgentRuntimeEndpoint,
                  bedrock-agentcore:GetAgentRuntimeEndpoint,
                  bedrock-agentcore:ListAgentRuntimeEndpoints]
        resource: runtime-endpoint/risk/DEFAULT
        audit: cloudtrail
        note: Sets targetVersion. Unpinned, the endpoint floats onto new versions.

    # --- serve a request -----------------------------------------------------
    invoke:
      - step: 8-authorize-caller
        produces: runtimeSessionId
        principal: [console-instance, orchestrator]
        actions: [bedrock-agentcore:InvokeAgentRuntime]
        resource: runtime/risk
        audit: none
        note: >-
          Data-plane call. NOT recorded in CloudTrail management events, so this
          hop has no audit trail by default - the reason it must be declared.
      - step: 9-assume-execution-role
        produces: temporary STS credentials for the runtime
        principal: bedrock-agentcore.amazonaws.com
        actions: [sts:AssumeRole]
        resource: role/AmazonBedrockAgentCoreSDKRuntime-*
        audit: cloudtrail
        note: Trust policy, not an identity policy - the other half of PassRole.
      - step: 11-session-memory
        produces: session event records
        principal: agent-runtime-execution
        actions: [bedrock-agentcore:CreateEvent, bedrock-agentcore:ListEvents,
                  bedrock-agentcore:RetrieveMemoryRecords]
        resource: memory/risk_mem
        audit: none
      - step: 12-model-invoke
        produces: fraud score, risk level, flags with guideline citations
        principal: agent-runtime-execution
        actions: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
        resource: inference-profile/us.amazon.nova-pro-v1:0
        audit: cloudtrail
        failsAs: >-
          ResourceNotFoundException when model access is not granted for the
          account, which surfaces at invoke time - never at provision time.
      - step: 13-telemetry
        produces: CloudWatch log stream + X-Ray trace
        principal: agent-runtime-execution
        actions: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents,
                  xray:PutTraceSegments]
        resource: log-group:/aws/bedrock-agentcore/runtimes/risk-*
        audit: none

    # --- teardown ------------------------------------------------------------
    teardown:
      - step: 14-delete
        produces: nothing (resources removed)
        principal: operator
        actions: [bedrock-agentcore:DeleteAgentRuntime,
                  bedrock-agentcore:DeleteMemory,
                  ecr:DeleteRepository, iam:DeleteRole]
        resource: [runtime/risk, memory/risk_mem, repository/bedrock-agentcore-risk]
        audit: cloudtrail

  console:
    key: risk
    group: specialist
    label: Risk, Fraud & Compliance
    arnEnv: RISK_ARN
    urlEnv: RISK_URL
    localPort: 8773

  env: {}
