apiVersion: agentcore/v1
kind: AgentRuntime

metadata:
  name: risk
  displayName: Risk, Fraud & Compliance
  description: >-
    RAG over a bundled guideline knowledge base. Produces a fraud score, risk
    level and compliance flags, each citing the guideline IDs it relied on.
  labels:
    phase: "1"
    role: risk

spec:
  source:
    framework: langchain
    language: python
    entrypoint: app.py
    build:
      type: container
      context: agents/langchain
      dockerfile: Dockerfile
      requirements: requirements.txt
      platform: linux/arm64
      remote_build: true

  model:
    id: us.amazon.nova-pro-v1:0
    overrideEnvVar: CLAUDE_MODEL

  runtime:
    protocol: HTTP
    networkMode: PUBLIC
    observability:
      enabled: true
    lifecycle:
      idleSessionTimeoutSeconds: null
      maxLifetimeSeconds: null

  memory:
    enabled: true
    name: risk_mem
    mode: STM_ONLY
    eventExpiryDays: 30

  identity:
    inbound:
      type: IAM
      jwt:
        enabled: false
        audiences: []
        issuerUrl: null
        signingAlgorithm: ES384
        durationSeconds: 300
    outbound:
      credentialProviders: []

  tools:
    mcpServers: []
    gateways: []

  dependencies: []

  data:
    # Baked into the image at build time; KB_DIR is resolved relative to the
    # module so the path holds inside the container.
    - name: guidelines-kb
      type: bundled
      source: agents/langchain/kb
      mountPath: /app/kb

  env: {}
