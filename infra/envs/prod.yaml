apiVersion: agentcore/v1
kind: Environment

metadata:
  name: prod
  description: >-
    Production overlay. Differences from dev are deliberate and each one is a
    control, not a preference.

spec:
  region: us-east-1
  accountAlias: agent-core-prod

  tags:
    Environment: prod
    Project: agent-core
    ManagedBy: terraform
    DataClassification: confidential

  agentDefaults:
    runtime:
      # Private networking: agents reach Bedrock over VPC endpoints rather than
      # public egress. Requires subnets/securityGroups per the schema.
      networkMode: VPC
      vpc:
        subnets: []               # populate from the network stack
        securityGroups: []
      lifecycle:
        idleSessionTimeoutSeconds: 900
        maxLifetimeSeconds: 28800
    memory:
      eventExpiryDays: 90
    observability:
      logRetentionDays: 365

  agentOverrides: {}

  services:
    web-console:
      cpu: 2048
      memory: 4096
      autoDeploy: false           # releases are explicit digest switches

  governance:
    signingMode: kms
    allowLocalFallback: false     # fail closed - never sign with an on-disk key
    allowRawBypass: false         # the gate is the point
    certificateExpiryDays: 90

  costControls:
    pauseConsoleWhenIdle: false

  # Things that must hold before a prod apply is allowed to proceed.
  guardrails:
    requirePinnedDigests: true    # no tags, ever
    requirePinnedRuntimeVersion: true
    requireImportMapForExisting: true
    denyPublicNetworkMode: true
